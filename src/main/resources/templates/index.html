<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh">
<head th:replace="common/head::static"></head>
<title>首页 · ZAZE 门户</title>
<body>

<div th:replace="common/nav::portal(${user}, ${isAdmin}, 'home')"></div>

<main class="container py-5">

    <section class="jumbotron bg-white border shadow-sm mb-4">
        <h1 class="display-4">
            欢迎，
            <span th:text="${user != null and !#strings.isEmpty(user.displayName)} ? ${user.displayName} : ${user?.username}">用户</span>
        </h1>
        <p class="lead mb-2">
            已登录为
            <span class="badge" th:classappend="${isAdmin} ? 'badge-danger' : 'badge-secondary'"
                  th:text="${isAdmin} ? '管理员' : '普通用户'">普通用户</span>
            ，可以访问下方对应入口。
        </p>
        <hr class="my-4">
        <p class="text-muted mb-0" th:if="${isAdmin}">
            管理员可进入管理后台触发采集、维护应用与版本信息。
        </p>
        <p class="text-muted mb-0" th:unless="${isAdmin}">
            普通用户可浏览应用市场；管理后台仅管理员可见。
        </p>
    </section>

    <div class="row">

        <div class="col-md-6 mb-4">
            <div class="card h-100 shadow-sm">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title"><i class="fas fa-store text-primary"></i> 应用市场</h5>
                    <p class="card-text text-muted">
                        浏览收集到的应用，查看每个应用下的多个版本，以及各版本不同来源的下载地址。
                    </p>
                    <a class="btn btn-primary mt-auto align-self-start" th:href="@{/appmarket/}">进入应用市场</a>
                </div>
            </div>
        </div>

        <div class="col-md-6 mb-4" th:if="${isAdmin}">
            <div class="card h-100 shadow-sm border-danger">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title"><i class="fas fa-tools text-danger"></i> 管理后台</h5>
                    <p class="card-text text-muted">
                        触发自动采集（GitHub Releases 等公开渠道），并管理应用、版本与下载地址。
                    </p>
                    <a class="btn btn-outline-danger mt-auto align-self-start" th:href="@{/appmarket/admin}">
                        进入管理后台
                    </a>
                </div>
            </div>
        </div>

        <div class="col-md-6 mb-4" th:unless="${isAdmin}">
            <div class="card h-100 shadow-sm">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title"><i class="fas fa-user"></i> 我的账号</h5>
                    <ul class="list-unstyled text-muted mb-4">
                        <li>用户名：<span th:text="${user?.username}">-</span></li>
                        <li>角色：<span th:text="${isAdmin} ? '管理员' : '普通用户'">普通用户</span></li>
                    </ul>
                    <span class="text-muted small mt-auto">需要管理后台权限请联系管理员。</span>
                </div>
            </div>
        </div>

    </div>
</main>

<footer class="container border-top py-4 text-muted small">
    <span>zaze-server · 应用市场门户</span>
    <span class="float-right">数据来源为公开渠道，仅提供外链</span>
</footer>

<script th:src="@{/js/portal.js}"></script>
</body>
</html>
