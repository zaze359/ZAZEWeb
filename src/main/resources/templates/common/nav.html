<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh">
<body>

<!--
  门户导航条（公共片段）。

  入参：user —— 当前登录用户 UserVo（未登录为 null，理论上不会走到这里，拦截器已挡）
        isAdmin —— 是否管理员，决定是否渲染"管理后台"入口
        active —— 当前页标识：home / appmarket / admin
-->
<nav th:fragment="portal(user, isAdmin, active)"
     class="navbar navbar-expand-md navbar-dark bg-dark shadow-sm">
    <a class="navbar-brand" th:href="@{/}">ZAZE 门户</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#portalNavbar"
            aria-controls="portalNavbar" aria-expanded="false" aria-label="切换导航">
        <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="portalNavbar">
        <ul class="navbar-nav mr-auto">
            <li class="nav-item" th:classappend="${active == 'home'} ? 'active'">
                <a class="nav-link" th:href="@{/}">首页</a>
            </li>
            <li class="nav-item" th:classappend="${active == 'appmarket'} ? 'active'">
                <a class="nav-link" th:href="@{/appmarket/}">应用市场</a>
            </li>
            <li class="nav-item" th:if="${isAdmin}" th:classappend="${active == 'admin'} ? 'active'">
                <a class="nav-link" th:href="@{/appmarket/admin}">管理后台</a>
            </li>
        </ul>

        <ul class="navbar-nav">
            <li class="nav-item">
                <span class="navbar-text mr-3">
                    <i class="fas fa-user-circle"></i>
                    <span th:text="${user != null and user.displayName != null and !#strings.isEmpty(user.displayName)} ? ${user.displayName} : ${user?.username}">用户</span>
                    <span class="badge ml-1"
                          th:classappend="${isAdmin} ? 'badge-danger' : 'badge-secondary'"
                          th:text="${isAdmin} ? '管理员' : '普通用户'">普通用户</span>
                </span>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="javascript:void(0);" id="btn-logout">退出</a>
            </li>
        </ul>
    </div>
</nav>

</body>
</html>
