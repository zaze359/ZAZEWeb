<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh">
<head th:replace="common/head::static"></head>
<title>登录 · ZAZE 门户</title>
<style>
    body {
        background: #f5f6f8;
    }

    .login-box {
        max-width: 380px;
        margin: 8vh auto 0;
    }
</style>
<body>

<div class="login-box">
    <div class="card shadow-sm">
        <div class="card-body">
            <h4 class="card-title mb-4 text-center">ZAZE 门户</h4>

            <div id="login-alert" class="alert alert-danger d-none" role="alert"></div>

            <form id="login-form" autocomplete="on">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" class="form-control" id="username" name="username"
                           placeholder="请输入用户名" autofocus>
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" class="form-control" id="password" name="password"
                           placeholder="请输入密码">
                </div>
                <button type="button" id="btn-login" class="btn btn-primary btn-block">登录</button>
            </form>

            <p class="text-muted small mt-3 mb-0 text-center">
                登录后可访问应用市场；管理后台仅管理员可见。
            </p>
        </div>
    </div>
</div>

<script th:src="@{/js/login.js}"></script>
</body>
</html>
