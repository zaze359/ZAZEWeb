server:
  port: 8080
  servlet:
    # 应用路径，配置应用路径，可方便进行反向代理
    context-path: /
    session:
      # 登录会话（token）时效：非活动超过此时长即失效、需重新登录。
      # 支持 Duration 写法：30m / 2h / 1d / 7d。当前为内网演示用的较长时效，生产建议改短（如 30m）并配合 HTTPS。
      timeout: 7d


spring:
  # 数据源配置
  datasource:
    url: jdbc:mysql://localhost:3306/dev?serverTimezone=GMT%2B8&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
#    type: com.hikari.HikariDataSource
#    driver-class-name: com.mysql.cj.jdbc.Driver
## okHttp 配置
ok:
  http:
    connect-timeout: 60
    read-timeout: 60
    write-timeout: 60
    max-idle-connections: 200
    keep-alive-duration: 300
